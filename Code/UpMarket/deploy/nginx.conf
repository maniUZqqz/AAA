# UpMarket reverse proxy.
#
# One origin for everything, so the browser never meets a cross-origin
# request: the marketing site at /, the panel API under /api, and the files
# Django wrote under /media. That also means the session id the marketing site
# stores is readable by the panel without passing it through a URL.

upstream backend  { server backend:8000; }
upstream website  { server website:3001; }

# Uploads are capped in Django too (MAX_UPLOAD_MB); this is the outer guard so
# an oversized body is refused before it reaches Python.
client_max_body_size 25m;

server {
    listen 80;
    server_name _;

    # Hide the nginx version from an attacker enumerating targets.
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;
    gzip_min_length 1024;

    # --- Django API and admin -------------------------------------------
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # The lead endpoint records this for abuse triage, so it has to be the
        # real client address rather than the proxy's.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A render request returns immediately, but the sync fallback does not.
        proxy_read_timeout 120s;
    }

    location /admin/ {
        proxy_pass http://backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Files Django produced ------------------------------------------
    # Served straight off the volume; Python should never stream a video.
    location /media/ {
        alias /srv/media/;
        expires 7d;
        add_header Cache-Control "public";
        # Anything uploaded is untrusted: never let the browser decide it is
        # HTML and run it on our origin.
        add_header X-Content-Type-Options nosniff always;
    }

    location /static/ {
        alias /srv/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # --- Marketing site --------------------------------------------------
    location / {
        proxy_pass http://website;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
